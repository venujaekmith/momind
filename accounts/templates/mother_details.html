{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Mother Details</title>
    <link href="{% static 'core/select-theme.css' %}" rel="stylesheet">
    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
        }

        .container {
            width: 500px;
            margin: 40px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 10px;
            background: #2d6cdf;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #1c4fb5;
        }
    </style>
</head>

<body>
<div class="container">
    <h2>Mother Health Details</h2>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Save Details</button>
    </form>
</div>
</body>
</html>
