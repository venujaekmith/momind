{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Role · MoMind</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        :root {
            --bg-cream: #fff5f8;
            --dusty-rose: #e85d8f;
            --soft-coral: #cc4677;
            --soft-lilac: #f3bfd0;
            --soft-teal: #d87195;
            --card: #ffffff;
            --text: #4b2735;
            --gray: #876f79;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; min-height: 100%; font-family: Inter, sans-serif; color: var(--text); }
        .role-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding: 24px;
            background: linear-gradient(145deg, var(--bg-cream), #F8EEEB, #F3E4EA);
        }
        .blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .45; }
        .blob-1 { width: 360px; height: 360px; background: var(--dusty-rose); top: -120px; left: -80px; animation: float-one 15s infinite alternate; }
        .blob-2 { width: 400px; height: 400px; background: var(--soft-lilac); bottom: -120px; right: -100px; animation: float-two 17s infinite alternate; }
        .blob-3 { width: 220px; height: 220px; background: var(--soft-teal); bottom: 20%; left: 10%; }
        @keyframes float-one { to { transform: translate(40px, 30px); } }
        @keyframes float-two { to { transform: translate(-40px, -20px); } }
        .role-card {
            width: 100%;
            max-width: 720px;
            padding: 40px;
            position: relative;
            z-index: 2;
            border-radius: 24px;
            background: rgba(255, 248, 245, .9);
            backdrop-filter: blur(15px);
            box-shadow: 0 25px 60px rgba(217, 140, 122, .25);
        }
        .role-icon {
            width: 65px;
            height: 65px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: white;
            font-size: 28px;
            background: linear-gradient(135deg, var(--dusty-rose), var(--soft-coral));
        }
        h1 { margin: 18px 0 8px; text-align: center; font-family: Fraunces, serif; }
        .subtitle { margin: 0 0 30px; text-align: center; color: var(--gray); }
        .messages { margin-bottom: 18px; }
        .message {
            padding: 12px 14px;
            border-left: 4px solid var(--soft-coral);
            border-radius: 12px;
            background: #fff;
        }
        .role-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; margin-bottom: 25px; }
        .role-option {
            padding: 24px;
            position: relative;
            cursor: pointer;
            text-align: center;
            border: 2px solid #f0d5ce;
            border-radius: 18px;
            background: white;
            transition: .3s;
        }
        .role-option input { position: absolute; opacity: 0; pointer-events: none; }
        .role-option i { color: var(--soft-coral); font-size: 34px; }
        .role-option span { display: block; margin-top: 12px; font-weight: 600; }
        .role-option:hover { transform: translateY(-4px); border-color: var(--soft-coral); }
        .role-option:has(input:focus-visible) { outline: 3px solid rgba(217, 140, 122, .3); }
        .role-option:has(input:checked) {
            color: white;
            border-color: var(--soft-coral);
            background: linear-gradient(135deg, var(--dusty-rose), var(--soft-coral));
            box-shadow: 0 15px 30px rgba(217, 140, 122, .35);
        }
        .role-option:has(input:checked) i { color: white; }
        .hospital-field { margin: 25px 0; }
        .hospital-field[hidden] { display: none; }
        .hospital-field label { display: block; margin-bottom: 10px; font-weight: 600; }
        .hospital-field input {
            width: 100%;
            padding: 15px;
            border: 1.5px solid #edd5cf;
            border-radius: 14px;
            font: inherit;
        }
        .hospital-field input:focus { outline: none; border-color: var(--soft-coral); box-shadow: 0 0 0 4px rgba(217, 140, 122, .15); }
        .continue-button {
            width: 100%;
            padding: 16px;
            border: 0;
            border-radius: 14px;
            color: white;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, var(--dusty-rose), var(--soft-coral));
            transition: .3s;
        }
        .continue-button:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(217, 140, 122, .35); }
        @media (prefers-reduced-motion: reduce) { .blob { animation: none; } }
        @media (max-width: 650px) {
            .role-grid { grid-template-columns: 1fr; }
            .role-card { padding: 28px; }
        }
    </style>
    <link href="{% static 'core/momind-theme.css' %}" rel="stylesheet">
</head>
<body>
<main class="role-page">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <section class="role-card" aria-labelledby="role-title">
        <div class="role-icon"><i class="bi bi-person-badge-fill"></i></div>
        <h1 id="role-title">Select Your Role</h1>
        <p class="subtitle">Choose the role that best describes you.</p>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}<div class="message">{{ message }}</div>{% endfor %}
            </div>
        {% endif %}

        <form method="post" id="roleForm">
            {% csrf_token %}
            <div class="role-grid">
                <label class="role-option"><input type="radio" name="role" value="MOTHER" {% if request.POST.role == 'MOTHER' %}checked{% endif %} required><i class="bi bi-heart-fill"></i><span>Mother</span></label>
                <label class="role-option"><input type="radio" name="role" value="FATHER" {% if request.POST.role == 'FATHER' %}checked{% endif %}><i class="bi bi-person-fill"></i><span>Father</span></label>
                <label class="role-option"><input type="radio" name="role" value="MIDWIFE" {% if request.POST.role == 'MIDWIFE' %}checked{% endif %}><i class="bi bi-bandaid-fill"></i><span>Midwife</span></label>
                <label class="role-option"><input type="radio" name="role" value="DOCTOR" {% if request.POST.role == 'DOCTOR' %}checked{% endif %}><i class="bi bi-hospital-fill"></i><span>Doctor</span></label>
                <label class="role-option"><input type="radio" name="role" value="HOSPITAL" {% if request.POST.role == 'HOSPITAL' %}checked{% endif %}><i class="bi bi-building-fill"></i><span>Hospital</span></label>
                <label class="role-option"><input type="radio" name="role" value="HOSPITAL_STAFF" {% if request.POST.role == 'HOSPITAL_STAFF' %}checked{% endif %}><i class="bi bi-people-fill"></i><span>Hospital Staff</span></label>
            </div>

            <div class="hospital-field" id="hospitalField" hidden>
                <label for="hospitalName">Hospital Name</label>
                <input type="text" id="hospitalName" name="hospital_name" value="{{ request.POST.hospital_name|default:'' }}" placeholder="Enter the hospital name">
            </div>

            <button type="submit" class="continue-button">Continue <i class="bi bi-arrow-right"></i></button>
        </form>
    </section>
</main>
<script>
    const roleInputs = document.querySelectorAll('input[name="role"]');
    const hospitalField = document.getElementById('hospitalField');
    const hospitalName = document.getElementById('hospitalName');

    function updateHospitalField() {
        const selected = document.querySelector('input[name="role"]:checked');
        const isHospital = selected && selected.value === 'HOSPITAL';
        hospitalField.hidden = !isHospital;
        hospitalName.required = isHospital;
        if (!isHospital) hospitalName.value = '';
    }

    roleInputs.forEach(input => input.addEventListener('change', updateHospitalField));
    updateHospitalField();
</script>
</body>
</html>
