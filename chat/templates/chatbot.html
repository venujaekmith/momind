{% load static %}
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maternal AI Chat</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    :root {
      --bg-cream: #fff5f8;
      --pink: #e85d8f;
      --peach: #f7b4c8;
      --coral: #cc4677;
      --lilac: #f3bfd0;
      --sage: #e8a1b8;
      --teal: #d87195;
      --card-bg: #ffffff;
      --text-dark: #4b2735;
      --text-gray: #876f79;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: 'Inter', sans-serif;
      color: var(--text-dark);
    }

    body {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
      background: linear-gradient(150deg, var(--bg-cream) 0%, #fff7fa 55%, #fde6ed 100%);
    }

    /* ---------- Drifting background blobs ---------- */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(70px);
      opacity: .55;
      z-index: 0;
      pointer-events: none;
    }
    .blob-1 {
      width: 340px; height: 340px; top: -110px; left: -100px;
      background: radial-gradient(circle at 30% 30%, var(--peach), var(--pink));
      animation: float1 16s ease-in-out infinite alternate;
    }
    .blob-2 {
      width: 380px; height: 380px; bottom: -140px; right: -120px;
      background: radial-gradient(circle at 60% 40%, var(--lilac), #e9a7bd);
      animation: float2 19s ease-in-out infinite alternate;
    }
    @keyframes float1 { from { transform: translate(0,0) scale(1); } to { transform: translate(30px,25px) scale(1.08); } }
    @keyframes float2 { from { transform: translate(0,0) scale(1); } to { transform: translate(-30px,-20px) scale(1.06); } }

    /* ---------- Floating doodle emoji, purely decorative + funny ---------- */
    .doodle {
      position: fixed;
      font-size: 26px;
      opacity: .5;
      z-index: 0;
      pointer-events: none;
      animation: doodleFloat 7s ease-in-out infinite;
    }
    .doodle-1 { top: 12%; left: 6%; animation-delay: 0s; }
    .doodle-2 { top: 70%; left: 8%; font-size: 22px; animation-delay: 1.4s; }
    .doodle-3 { top: 20%; right: 7%; animation-delay: 2.6s; }
    .doodle-4 { top: 78%; right: 9%; font-size: 30px; animation-delay: .8s; }
    @keyframes doodleFloat {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50%      { transform: translateY(-16px) rotate(6deg); }
    }

    /* ---------- Chat shell ---------- */
    .chat-container {
      position: relative;
      z-index: 2;
      width: 420px;
      max-width: 92vw;
      height: 90vh;
      background: rgba(255,248,245,.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      margin-top: 20px;
      border-radius: 26px;
      border: 1px solid rgba(255,255,255,.6);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 25px 60px -20px rgba(217,140,122,.35);
      animation: containerIn .6s cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes containerIn {
      from { opacity: 0; transform: translateY(20px) scale(.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ---------- Header ---------- */
    .header {
      position: relative;
      padding: 18px 16px 16px;
      background: linear-gradient(100deg, var(--pink), var(--coral));
      color: #fff;
      text-align: center;
      overflow: hidden;
    }
    .header-inner {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .back-link {
      position: absolute;
      left: 14px;
      z-index: 2;
      color: #fff;
      text-decoration: none;
      font-size: .8rem;
      font-weight: 600;
      opacity: .9;
    }
    .back-link:hover { opacity: 1; }
    .mascot {
      font-size: 30px;
      display: inline-block;
      animation: bob 2.2s ease-in-out infinite;
      transform-origin: bottom center;
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(-6deg); }
      50%      { transform: translateY(-6px) rotate(6deg); }
    }
    .header-text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    .header-text strong {
      font-family: 'Fraunces', serif;
      font-size: 1.1rem;
      font-weight: 600;
      line-height: 1.2;
    }
    .header-text span {
      font-size: .72rem;
      opacity: .9;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #9be6a8;
      display: inline-block;
      box-shadow: 0 0 0 rgba(155,230,168,.6);
      animation: pulseDot 1.8s ease-out infinite;
    }
    @keyframes pulseDot {
      0%   { box-shadow: 0 0 0 0 rgba(155,230,168,.6); }
      70%  { box-shadow: 0 0 0 6px rgba(155,230,168,0); }
      100% { box-shadow: 0 0 0 0 rgba(155,230,168,0); }
    }
    /* little sparkle confetti drifting through the header, just for fun */
    .header::before, .header::after {
      content: "✦";
      position: absolute;
      color: rgba(255,255,255,.55);
      font-size: 12px;
      animation: sparkle 3.4s linear infinite;
    }
    .header::before { top: 10px; left: 20%; animation-delay: 0s; }
    .header::after   { top: 55%; left: 82%; animation-delay: 1.6s; font-size: 9px; }
    @keyframes sparkle {
      0%   { opacity: 0; transform: translateY(6px) scale(.6) rotate(0deg); }
      50%  { opacity: 1; transform: translateY(-4px) scale(1) rotate(90deg); }
      100% { opacity: 0; transform: translateY(-14px) scale(.6) rotate(180deg); }
    }

    /* ---------- Messages ---------- */
    .messages {
      flex: 1;
      padding: 16px 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .messages::-webkit-scrollbar { width: 6px; }
    .messages::-webkit-scrollbar-thumb { background: rgba(217,140,122,.3); border-radius: 10px; }

    .msg {
      margin: 6px 0;
      padding: 11px 15px;
      border-radius: 18px;
      max-width: 78%;
      word-wrap: break-word;
      font-size: .92rem;
      line-height: 1.5;
      opacity: 0;
      transform: scale(.85) translateY(6px);
      animation: popIn .38s cubic-bezier(.34,1.56,.64,1) forwards;
      box-shadow: 0 4px 14px -8px rgba(0,0,0,.15);
    }
    @keyframes popIn {
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .msg.user {
      background: linear-gradient(100deg, var(--pink), var(--coral));
      color: #fff;
      margin-left: auto;
      border-bottom-right-radius: 5px;
    }
    .msg.ai {
      background: #fff;
      border: 1px solid rgba(217,140,122,.18);
      margin-right: auto;
      border-bottom-left-radius: 5px;
    }

    /* ---------- Typing indicator ---------- */
    .typing {
      display: flex;
      align-items: center;
      gap: 5px;
      margin: 6px 14px 6px 0;
      padding: 12px 16px;
      border-radius: 18px;
      border-bottom-left-radius: 5px;
      background: #fff;
      border: 1px solid rgba(217,140,122,.18);
      width: fit-content;
      opacity: 0;
      transform: scale(.85);
      animation: popIn .3s cubic-bezier(.34,1.56,.64,1) forwards;
    }
    .typing span {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--coral);
      display: inline-block;
      animation: typingBounce 1.1s ease-in-out infinite;
    }
    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .3s; }
    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: .5; }
      30%           { transform: translateY(-6px); opacity: 1; }
    }

    /* ---------- Input row ---------- */
    .input-box {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid rgba(217,140,122,.18);
      background: rgba(255,255,255,.5);
    }

    input {
      flex: 1;
      padding: 13px 16px;
      border: 1.5px solid rgba(217,140,122,.25);
      border-radius: 999px;
      outline: none;
      font-size: .92rem;
      font-family: 'Inter', sans-serif;
      background: #fff;
      color: var(--text-dark);
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    input:hover { border-color: var(--coral); }
    input:focus {
      border-color: var(--coral);
      box-shadow: 0 0 0 4px rgba(217,140,122,.15);
    }

    button {
      background: linear-gradient(100deg, var(--pink), var(--coral));
      color: white;
      border: none;
      border-radius: 999px;
      padding: 0 22px;
      font-weight: 700;
      font-size: .9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 10px 20px -10px rgba(217,140,122,.6);
      transition: transform .15s cubic-bezier(.34,1.56,.64,1), box-shadow .15s ease;
    }
    button:hover {
      transform: translateY(-2px) rotate(-2deg) scale(1.04);
      box-shadow: 0 14px 26px -10px rgba(217,140,122,.7);
    }
    button:active {
      transform: translateY(0) rotate(0deg) scale(.96);
    }
    button .send-icon {
      display: inline-block;
      transition: transform .2s ease;
    }
    button:hover .send-icon {
      transform: translateX(3px) rotate(12deg);
    }

    @media (prefers-reduced-motion: reduce) {
      .blob, .doodle, .mascot, .header::before, .header::after, .status-dot,
      .chat-container, .msg, .typing span, button {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
    }

    @media (max-width: 460px) {
      .chat-container { height: 94vh; margin-top: 10px; border-radius: 20px; }
    }
  </style>
    <link href="{% static 'core/momind-theme.css' %}" rel="stylesheet">
</head>

<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="doodle doodle-1">🌸</div>
<div class="doodle doodle-2">💫</div>
<div class="doodle doodle-3">🍼</div>
<div class="doodle doodle-4">🩺</div>

<div class="chat-container">

  <div class="header">
    <a class="back-link" href="{% url 'dashboards:dashboard' %}" aria-label="Back to dashboard">← Dashboard</a>
    <div class="header-inner">
      <span class="mascot">🩺</span>
      <div class="header-text">
        <strong>Maternal AI Assistant</strong>
        <span><span class="status-dot"></span> here for you, any time</span>
      </div>
    </div>
  </div>

  <div class="messages" id="messages" role="log" aria-live="polite">
    <div class="msg ai">Hi, I’m here to support you. What would you like to talk about?</div>
  </div>

  <form class="input-box" id="chatForm">
    {% csrf_token %}
    <input type="text" id="msgInput" maxlength="2000" autocomplete="off" placeholder="Ask something..." aria-label="Message" />
    <button type="submit" id="sendButton">
      Send <span class="send-icon">➜</span>
    </button>
  </form>

</div>

<script>
let sessionId = null;
let isSending = false;

const chatUrls = {
    start: "{% url 'chat:start_session' %}",
    send: "{% url 'chat:send_message' %}",
    messages: "{% url 'chat:get_messages' 0 %}"
};

function getCSRFToken() {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, 10) === 'csrftoken=') {
                cookieValue = decodeURIComponent(cookie.substring(10));
                break;
            }
        }
    }
    return cookieValue;
}

// 🚀 Start session
async function startSession() {
    try {
        const res = await fetch(chatUrls.start, {
            method: "POST",
            headers: {"Content-Type": "application/json", "X-CSRFToken": getCSRFToken()},
        });
        if (!res.ok) throw new Error("Unable to start chat");
        const data = await res.json();
        sessionId = data.session_id;
        await loadMessages();
    } catch (error) {
        addMessage("ai", "The chat could not connect. Please refresh and try again.");
    }
}

// 📩 Send message
async function sendMessage() {
    const input = document.getElementById("msgInput");
    const button = document.getElementById("sendButton");
    const message = input.value.trim();
    if (!message || !sessionId || isSending) return;

    isSending = true;
    button.disabled = true;
    input.value = "";
    addMessage("user", message);
    showTyping();

    try {
        const res = await fetch(chatUrls.send, {
            method: "POST",
            headers: {"Content-Type": "application/json", "X-CSRFToken": getCSRFToken()},
            body: JSON.stringify({session_id: sessionId, message})
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Unable to send message");
        addMessage("ai", data.reply);
    } catch (error) {
        addMessage("ai", error.message || "Unable to send your message. Please try again.");
    } finally {
        hideTyping();
        isSending = false;
        button.disabled = false;
        input.focus();
    }
}

// 📜 Load history
async function loadMessages() {
    const url = chatUrls.messages.replace("/0/", `/${sessionId}/`);
    const res = await fetch(url);
    if (!res.ok) throw new Error("Unable to load messages");
    const data = await res.json();

    if (!data.messages.length) return;
    document.getElementById("messages").innerHTML = "";

    data.messages.forEach(m => {
        addMessage(m.sender, m.message);
    });
}

// ⌨️ Typing indicator helpers
function showTyping() {
    let container = document.getElementById("messages");
    let div = document.createElement("div");
    div.classList.add("typing");
    div.id = "typingIndicator";
    div.innerHTML = "<span></span><span></span><span></span>";
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
}

function hideTyping() {
    let el = document.getElementById("typingIndicator");
    if (el) el.remove();
}

// 💬 UI helper
function addMessage(sender, text) {
    let div = document.createElement("div");
    div.classList.add("msg");
    div.classList.add(sender === "user" ? "user" : "ai");
    div.innerText = text;

    let container = document.getElementById("messages");
    container.appendChild(div);

    container.scrollTop = container.scrollHeight;
}

// init
document.getElementById("chatForm").addEventListener("submit", event => {
    event.preventDefault();
    sendMessage();
});
startSession();
</script>

</body>
</html>
