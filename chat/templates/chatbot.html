{% extends 'basec.html' %}

{% block extra_head %}
<style>
  .chat-page {
    width: min(100%, 980px);
    margin-inline: auto;
  }

  .chat-shell {
    display: grid;
    grid-template-rows: auto minmax(360px, 1fr) auto;
    height: min(76vh, 760px);
    min-height: 560px;
    overflow: hidden;
    background: #fff;
    border: 1px solid #f0bdcc;
    border-radius: 22px;
    box-shadow: 0 18px 50px rgba(126, 42, 75, 0.14);
  }

  .chat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 1.1rem 1.35rem;
    color: #fff;
    background: linear-gradient(135deg, #e85d8f, #a13e63);
  }

  .chat-identity {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    min-width: 0;
  }

  .chat-avatar {
    display: grid;
    flex: 0 0 46px;
    width: 46px;
    height: 46px;
    place-items: center;
    color: #a13e63;
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 8px 20px rgba(76, 20, 42, 0.18);
  }

  .chat-title {
    margin: 0;
    color: #fff;
    font-size: clamp(1.05rem, 3vw, 1.35rem);
  }

  .chat-subtitle {
    margin: 0.15rem 0 0;
    color: rgba(255, 255, 255, 0.82);
    font-size: 0.82rem;
  }

  .chat-status {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.4rem 0.7rem;
    white-space: nowrap;
    color: #fff;
    background: rgba(255, 255, 255, 0.14);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 999px;
    font-size: 0.76rem;
  }

  .chat-status::before {
    width: 8px;
    height: 8px;
    content: "";
    background: #8df0b0;
    border-radius: 50%;
    box-shadow: 0 0 0 3px rgba(141, 240, 176, 0.18);
  }

  .chat-messages {
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
    overflow-y: auto;
    padding: 1.35rem;
    background:
      radial-gradient(circle at 5% 5%, rgba(232, 93, 143, 0.08), transparent 25%),
      linear-gradient(180deg, #fffafb, #fff);
    scroll-behavior: smooth;
  }

  .chat-welcome {
    width: min(100%, 520px);
    margin: auto;
    padding: 1.5rem;
    text-align: center;
    color: #6e3a4e;
    background: rgba(255, 255, 255, 0.9);
    border: 1px solid #f1ccd7;
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(126, 42, 75, 0.08);
  }

  .chat-welcome i {
    display: block;
    margin-bottom: 0.75rem;
    color: #e85d8f;
    font-size: 2rem;
  }

  .chat-message {
    display: flex;
    flex-direction: column;
    max-width: min(78%, 620px);
    padding: 0.75rem 0.95rem;
    line-height: 1.55;
    overflow-wrap: anywhere;
    border-radius: 16px;
    animation: chatMessageIn 0.2s ease;
  }

  .chat-message--user {
    align-self: flex-end;
    color: #fff;
    background: linear-gradient(135deg, #e85d8f, #cc4677);
    border-bottom-right-radius: 5px;
    box-shadow: 0 6px 16px rgba(204, 70, 119, 0.2);
  }

  .chat-message--ai {
    align-self: flex-start;
    color: #4f2938;
    background: #fff;
    border: 1px solid #efd5dd;
    border-bottom-left-radius: 5px;
    box-shadow: 0 6px 16px rgba(126, 42, 75, 0.08);
  }

  .chat-message--error {
    color: #8f2737;
    background: #fff0f2;
    border-color: #f2bac4;
  }

  @keyframes chatMessageIn {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .chat-composer {
    display: flex;
    align-items: flex-end;
    gap: 0.75rem;
    padding: 1rem 1.15rem;
    background: #fff;
    border-top: 1px solid #efd5dd;
  }

  .chat-input {
    flex: 1;
    min-width: 0;
    min-height: 46px;
    max-height: 130px;
    padding: 0.75rem 1rem;
    resize: none;
    color: #2d3748;
    background: #fffafb;
    border: 2px solid #eadde2;
    border-radius: 16px;
    font: inherit;
    line-height: 1.45;
  }

  .chat-input:focus {
    outline: none;
    background: #fff;
    border-color: #e85d8f;
    box-shadow: 0 0 0 4px rgba(232, 93, 143, 0.1);
  }

  .chat-send {
    display: inline-grid;
    flex: 0 0 46px;
    width: 46px;
    height: 46px;
    place-items: center;
    color: #fff;
    background: linear-gradient(135deg, #e85d8f, #b83b6e);
    border: 0;
    border-radius: 14px;
    box-shadow: 0 6px 16px rgba(204, 70, 119, 0.24);
    cursor: pointer;
    transition: transform 0.2s ease, opacity 0.2s ease;
  }

  .chat-send:hover { transform: translateY(-2px); }
  .chat-send:disabled { opacity: 0.55; cursor: wait; transform: none; }

  @media (max-width: 768px) {
    .chat-shell {
      height: calc(100dvh - 7rem);
      min-height: 500px;
      border-radius: 16px;
    }

    .chat-header { padding: 0.85rem 1rem; }
    .chat-status { display: none; }
    .chat-messages { padding: 1rem; }
    .chat-message { max-width: 88%; }
    .chat-composer { padding: 0.75rem; }
  }
</style>
{% endblock %}

{% block content %}
<div class="chat-page">
  <section class="chat-shell" aria-labelledby="chat-title">
    <header class="chat-header">
      <div class="chat-identity">
        <span class="chat-avatar"><i class="fas fa-robot"></i></span>
        <div>
          <h1 class="chat-title" id="chat-title">Maternal AI Assistant</h1>
          <p class="chat-subtitle">Supportive guidance for your care journey</p>
        </div>
      </div>
      <span class="chat-status" id="chatStatus">Connecting</span>
    </header>

    <div class="chat-messages" id="messages" role="log" aria-live="polite" aria-label="Chat messages">
      <div class="chat-welcome" id="chatWelcome">
        <i class="fas fa-heart-pulse"></i>
        <strong>How can I support you today?</strong>
        <p class="text-muted">Ask about pregnancy, postpartum wellbeing, baby care, nutrition, or appointments.</p>
      </div>
    </div>

    <form class="chat-composer" id="chatForm">
      <textarea class="chat-input" id="msgInput" rows="1" maxlength="2000" placeholder="Type your question…" aria-label="Message"></textarea>
      <button class="chat-send" id="sendButton" type="submit" aria-label="Send message">
        <i class="fas fa-paper-plane"></i>
      </button>
    </form>
  </section>
</div>

<script>
  let sessionId = null;
  let isSending = false;

  const chatUrls = {
    start: "{% url 'chat:start_session' %}",
    send: "{% url 'chat:send_message' %}",
    messages: "{% url 'chat:get_messages' 0 %}"
  };

  function getCSRFToken() {
    const cookie = document.cookie
      .split(';')
      .map(value => value.trim())
      .find(value => value.startsWith('csrftoken='));
    return cookie ? decodeURIComponent(cookie.substring(10)) : '';
  }

  function setChatStatus(text) {
    const status = document.getElementById('chatStatus');
    if (status) status.textContent = text;
  }

  function addMessage(sender, text, isError = false) {
    document.getElementById('chatWelcome')?.remove();
    const message = document.createElement('div');
    message.className = `chat-message chat-message--${sender === 'user' ? 'user' : 'ai'}`;
    if (isError) message.classList.add('chat-message--error');
    message.textContent = text;

    const container = document.getElementById('messages');
    container.appendChild(message);
    container.scrollTop = container.scrollHeight;
  }

  async function startSession() {
    try {
      const response = await fetch(chatUrls.start, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': getCSRFToken()
        }
      });
      if (!response.ok) throw new Error('Unable to start chat');
      const data = await response.json();
      sessionId = data.session_id;
      await loadMessages();
      setChatStatus('Online');
    } catch (error) {
      setChatStatus('Unavailable');
      addMessage('ai', 'The assistant could not connect. Please refresh and try again.', true);
    }
  }

  async function loadMessages() {
    const response = await fetch(chatUrls.messages.replace('/0/', `/${sessionId}/`));
    if (!response.ok) throw new Error('Unable to load messages');
    const data = await response.json();
    if (!data.messages.length) return;

    document.getElementById('messages').innerHTML = '';
    data.messages.forEach(message => addMessage(message.sender, message.message));
  }

  async function sendMessage() {
    const input = document.getElementById('msgInput');
    const button = document.getElementById('sendButton');
    const message = input.value.trim();
    if (!message || !sessionId || isSending) return;

    isSending = true;
    button.disabled = true;
    input.value = '';
    addMessage('user', message);
    setChatStatus('Thinking…');

    try {
      const response = await fetch(chatUrls.send, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': getCSRFToken()
        },
        body: JSON.stringify({ session_id: sessionId, message })
      });
      if (!response.ok) throw new Error('Unable to send message');
      const data = await response.json();
      addMessage('ai', data.reply || 'I could not generate a response.');
      setChatStatus('Online');
    } catch (error) {
      addMessage('ai', 'Your message could not be sent. Please try again.', true);
      setChatStatus('Online');
    } finally {
      isSending = false;
      button.disabled = false;
      input.focus();
    }
  }

  document.getElementById('chatForm').addEventListener('submit', function (event) {
    event.preventDefault();
    sendMessage();
  });

  document.getElementById('msgInput').addEventListener('keydown', function (event) {
    if (event.key === 'Enter' && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }
  });

  startSession();
</script>
{% endblock %}
