{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Checkup Bot</title>
    <style>
        body { margin:0; min-height:100vh; display:grid; place-items:center; background:#fff4f7; font-family:Arial,sans-serif; color:#4b2735; }
        .checkup { width:min(560px,92vw); height:min(720px,90vh); display:flex; flex-direction:column; background:#fff; border:1px solid #f0bdcc; border-radius:22px; overflow:hidden; box-shadow:0 18px 50px rgba(126,42,75,.14); }
        header { padding:22px; color:#fff; background:linear-gradient(135deg,#e85d8f,#a13e63); }
        header h1 { margin:0 0 5px; font-size:1.35rem; } header p { margin:0; opacity:.9; font-size:.86rem; }
        .messages { flex:1; overflow:auto; padding:18px; } .message { max-width:82%; margin:8px 0; padding:12px 15px; border-radius:16px; line-height:1.5; white-space:pre-wrap; }
        .message.ai { background:#fff4f7; border:1px solid #f4d2dc; } .message.user { margin-left:auto; color:#fff; background:#cc4677; }
        form { display:flex; gap:8px; padding:14px; border-top:1px solid #f1d4dc; } input { flex:1; padding:12px; border:1px solid #e7aabd; border-radius:12px; } button { border:0; border-radius:12px; padding:0 18px; color:#fff; background:#cc4677; cursor:pointer; }
        .back { color:#fff; font-size:.8rem; }
    </style>
</head>
<body>
<main class="checkup">
    <header>
        <a class="back" href="{% url 'dashboards:dashboard' %}">← Dashboard</a>
        <h1>Checkup Bot</h1>
        <p>Answer up to five questions. Your answers are shared only with your authorized care team.</p>
    </header>
    <div id="messages" class="messages" role="log" aria-live="polite"></div>
    <div id="progress" style="padding:10px 18px; font-size:.9rem; color:#8a3c59;" aria-live="polite">
        Preparing your checkup...
    </div>
    <form id="checkupForm">
        {% csrf_token %}
        <input id="answer" maxlength="2000" autocomplete="off" placeholder="Type your answer..." required>
        <button id="send" type="submit">Send</button>
    </form>
</main>
<script>
let sessionId = null;
let questionId = null;
const startUrl = "{% url 'chat:start_checkup_session' %}";
const sendUrl = "{% url 'chat:send_checkup_message' %}";
const csrf = document.querySelector("[name=csrfmiddlewaretoken]").value;
function addMessage(sender, text) {
    if (!text) return;
    const item = document.createElement("div");
    item.className = "message " + sender;
    item.textContent = text;
    const messages = document.getElementById("messages");
    messages.appendChild(item);
    messages.scrollTop = messages.scrollHeight;
}
function updateProgress(data) {
    const remaining = Number(data.remaining_questions || 0);
    const answered = Number(data.answered_questions || 0);
    const total = Number(data.total_questions || 5);
    document.getElementById("progress").textContent = data.complete
        ? `Checkup complete — ${answered} of ${total} questions answered`
        : `${remaining} question${remaining === 1 ? "" : "s"} more (${answered} of ${total} answered)`;
}
async function start() {
    const response = await fetch(startUrl, {method:"POST", headers:{"X-CSRFToken":csrf}});
    const data = await response.json();
    if (!response.ok) { addMessage("ai", data.error || "Checkup Bot is unavailable."); return; }
    sessionId = data.session_id;
    questionId = data.question_id;
    updateProgress(data);
    addMessage("ai", "Please answer this checkup question:\n" + data.question);
}
document.getElementById("checkupForm").addEventListener("submit", async event => {
    event.preventDefault();
    const input = document.getElementById("answer");
    const answer = input.value.trim();
    if (!answer || !sessionId || !questionId) return;
    input.value = ""; addMessage("user", answer);
    const response = await fetch(sendUrl, {
        method:"POST",
        headers:{"Content-Type":"application/json","X-CSRFToken":csrf},
        body:JSON.stringify({session_id:sessionId, question_id:questionId, message:answer})
    });
    const data = await response.json();
    if (!response.ok) { addMessage("ai", data.error || "Unable to save this answer."); return; }
    questionId = data.question_id;
    updateProgress(data);
    addMessage("ai", data.complete ? "Checkup complete. Thank you. Your care team can review the summary." : "Next question:\n" + data.question);
});
start();
</script>
</body>
</html>
