{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Maternal Support</title>
    <link href="{% static 'core/select-theme.css' %}" rel="stylesheet">

    <style>
        body {
            font-family: Arial;
            margin: 40px;
            background: #f7f7f7;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        textarea,
        input,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }

        button {
            padding: 10px 20px;
            margin-top: 10px;
        }

        a {
            text-decoration: none;
        }
    </style>
</head>
<body>

<h1>Maternal Support Platform</h1>

<hr>

{% block content %}
{% endblock %}

</body>
</html>
