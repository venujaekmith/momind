{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoMind | Maternal Support</title>
    <link rel="icon" type="image/png" href="{% static 'core/images/momind-logo.png' %}">
    <link href="{% static 'core/select-theme.css' %}" rel="stylesheet">

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f7f7f7;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        textarea,
        input,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }

        button {
            padding: 10px 20px;
            margin-top: 10px;
        }

        a {
            text-decoration: none;
        }

        .community-brand,
        body > hr,
        body > main {
            width: min(100% - 2rem, 1200px);
            margin-left: auto;
            margin-right: auto;
        }

        .community-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-top: 1.5rem;
            color: #743149;
        }

        .community-brand img {
            width: 48px;
            height: 48px;
            object-fit: contain;
        }

        .community-brand h1 {
            margin: 0;
            font-size: 1.8rem;
        }

        .community-brand p {
            margin: 0.15rem 0 0;
            color: #9a6076;
            font-size: 0.8rem;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            .community-brand,
            body > hr,
            body > main { width: min(100% - 1rem, 1200px); }
        }
    </style>
</head>
<body>

<header class="community-brand">
    <img src="{% static 'core/images/momind-logo.png' %}" alt="">
    <div>
        <h1>MoMind</h1>
        <p>Maternal Support Platform</p>
    </div>
</header>

<hr>

{% block content %}
{% endblock %}

</body>
</html>
