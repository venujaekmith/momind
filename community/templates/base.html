{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maternal Support</title>
    <link href="{% static 'core/select-theme.css' %}" rel="stylesheet">

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f7f7f7;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        textarea,
        input,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }

        button {
            padding: 10px 20px;
            margin-top: 10px;
        }

        a {
            text-decoration: none;
        }

        body > h1,
        body > hr,
        body > main {
            width: min(100% - 2rem, 1200px);
            margin-left: auto;
            margin-right: auto;
        }

        body > h1 { margin-top: 1.5rem; }

        @media (max-width: 600px) {
            body > h1,
            body > hr,
            body > main { width: min(100% - 1rem, 1200px); }
        }
    </style>
</head>
<body>

<h1>Maternal Support Platform</h1>

<hr>

{% block content %}
{% endblock %}

</body>
</html>
