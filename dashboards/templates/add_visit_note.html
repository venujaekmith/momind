{% extends 'basec.html' %}

{% block content %}
<div class="card-pink" style="max-width: 900px; margin: 0 auto;">
    <h2><i class="fas fa-notes-medical"></i> New Visit Note - {{ pregnancy.mother.user.get_full_name|default:pregnancy.mother.user.username }}</h2>
    
    <form method="POST">
        {% csrf_token %}
        <div class="grid-2">
            <div class="form-group">
                <label>Visit Date</label>
                <input type="date" name="visit_date" value="{{ today|date:'Y-m-d' }}" required>
            </div>
            <div class="form-group">
                <label>Linked Appointment (Optional)</label>
                <select name="scheduled_event">
                    <option value="">-- Not linked --</option>
                    {% for event in upcoming_events %}
                    <option value="{{ event.id }}">{{ event.title }} - {{ event.scheduled_date }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        
        <div class="form-group">
            <label>Clinical Findings</label>
            <textarea name="findings" rows="4" placeholder="Blood Pressure, Weight, Fundal Height, Temperature, etc..."></textarea>
        </div>
        
        <div class="form-group">
            <label>Visit Notes</label>
            <textarea name="notes" rows="5" required placeholder="General observations, mother's concerns, baby's condition..."></textarea>
        </div>
        
        <div class="form-group">
            <label>Recommendations / Advice Given</label>
            <textarea name="recommendations" rows="4" placeholder="Continue iron tablets, rest more, come back in 4 weeks, etc..."></textarea>
        </div>
        
        <div class="flex-between">
            <a href="{% url 'dashboards:midwife_mother_detail' pregnancy.id %}" class="btn-outline-pink">← Cancel</a>
            <button type="submit" class="btn-pink"><i class="fas fa-save"></i> Save Visit Note</button>
        </div>
    </form>
</div>
{% endblock %}
