{% extends 'basec.html' %}

{% block content %}
<div class="page-shell">
    <div class="card-pink">
        <div class="page-heading">
            <h2><i class="fas fa-clinic-medical"></i> {% if is_edit %}Edit Clinic{% else %}Create Clinic{% endif %}</h2>
            <p>Enter the clinic session details below.</p>
        </div>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="form-actions">
                <a href="{% url 'dashboards:dashboard' %}" class="btn-outline-pink">Cancel</a>
                <button type="submit" class="btn-pink"><i class="fas fa-save"></i> Save Clinic</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
