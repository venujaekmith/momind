{% extends 'basec.html' %}

{% block content %}

    <h2><i class="fas fa-flask"></i> Add Lab Test</h2>

        {{ form.as_p }}
        <button type="submit" class="btn-pink">Save Lab Test</button>
    </form>
</div>
{% endblock %}
