{% extends 'basec.html' %}
{% block content %}
<div style="text-align:center; max-width:600px; margin:40px auto;">
    <h1>My QR Code</h1>
    <p>Share this QR code with mothers/families to join them</p>
    
    <img src="{{ qr_url }}" alt="My QR Code" style="width:320px; border:3px solid #333; border-radius:15px; padding:10px;">
    
    <p><strong>Token:</strong> {{ profile.qr_token }}</p>
    <a href="{% url 'dashboards:dashboard' %}">← Back to Dashboard</a>
</div>
{% endblock %}
