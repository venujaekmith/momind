<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Momind Maternal Care Agent workflow</title>
  <desc id="desc">Bounded and auditable agent workflow from memory retrieval through human-reviewed care coordination.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#eef5ff"/></linearGradient>
    <linearGradient id="header" x1="0" x2="1"><stop offset="0" stop-color="#123b70"/><stop offset="1" stop-color="#176b87"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#17324d" flood-opacity=".14"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#42627d"/></marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#fff}.subtitle{font:400 17px Arial,sans-serif;fill:#dcecff}
      .section{font:700 21px Arial,sans-serif;fill:#123b70}.label{font:700 17px Arial,sans-serif;fill:#17324d}
      .body{font:400 14px Arial,sans-serif;fill:#36536b}.small{font:400 13px Arial,sans-serif;fill:#527087}
      .box{stroke:#c8d9e8;stroke-width:2;rx:16}.arrow{stroke:#42627d;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="120" fill="url(#header)"/>
  <text x="70" y="56" class="title">MOMIND — MATERNAL CARE AGENT</text>
  <text x="70" y="88" class="subtitle">Bounded workflow, explicit safety limits, and a persistent audit trail</text>

  <rect x="70" y="155" width="1460" height="110" rx="18" fill="#dceeff" stroke="#9ec7e2" stroke-width="2"/>
  <text x="800" y="195" text-anchor="middle" class="section">Agent objective</text>
  <text x="800" y="228" text-anchor="middle" class="body">Review longitudinal maternal-health records, assess current risk, explain evidence, and take permitted care-coordination actions.</text>

  <text x="70" y="320" class="section">Controlled execution plan</text>
  <g filter="url(#shadow)">
    <rect class="box" x="70" y="350" width="320" height="115" fill="#fff"/>
    <rect class="box" x="440" y="350" width="320" height="115" fill="#fff"/>
    <rect class="box" x="810" y="350" width="320" height="115" fill="#fff"/>
    <rect class="box" x="1180" y="350" width="350" height="115" fill="#fff"/>
  </g>
  <circle cx="105" cy="390" r="22" fill="#176b87"/><text x="105" y="397" text-anchor="middle" style="font:700 17px Arial;fill:#fff">1</text>
  <text x="145" y="390" class="label">Retrieve memory</text><text x="145" y="420" class="body">Previous assessments</text><text x="145" y="443" class="body">and longitudinal context</text>
  <circle cx="475" cy="390" r="22" fill="#176b87"/><text x="475" y="397" text-anchor="middle" style="font:700 17px Arial;fill:#fff">2</text>
  <text x="515" y="390" class="label">Inspect health record</text><text x="515" y="420" class="body">Maternal, fetal, lab,</text><text x="515" y="443" class="body">and postpartum evidence</text>
  <circle cx="845" cy="390" r="22" fill="#176b87"/><text x="845" y="397" text-anchor="middle" style="font:700 17px Arial;fill:#fff">3</text>
  <text x="885" y="390" class="label">Calculate hybrid risk</text><text x="885" y="420" class="body">Model + safety rules</text><text x="885" y="443" class="body">+ explanation</text>
  <circle cx="1215" cy="390" r="22" fill="#176b87"/><text x="1215" y="397" text-anchor="middle" style="font:700 17px Arial;fill:#fff">4</text>
  <text x="1255" y="390" class="label">Decide permitted actions</text><text x="1255" y="420" class="body">Use severity, evidence,</text><text x="1255" y="443" class="body">and prior memory</text>

  <path class="arrow" d="M390 408 L430 408"/><path class="arrow" d="M760 408 L800 408"/><path class="arrow" d="M1130 408 L1170 408"/>
  <path class="arrow" d="M1360 480 L1360 535"/>
  <rect x="350" y="535" width="1020" height="120" rx="18" fill="#e8f7f4" stroke="#9bd6c9" stroke-width="2" filter="url(#shadow)"/>
  <text x="860" y="575" text-anchor="middle" class="section">5. Execute care-coordination actions</text>
  <text x="860" y="607" text-anchor="middle" class="body">Create an in-app alert and notify approved family or care-team members when policy permits.</text>
  <text x="860" y="632" text-anchor="middle" class="small">Actions are bounded; the agent does not diagnose, prescribe, or contact emergency services.</text>

  <path class="arrow" d="M860 680 L860 730"/>
  <rect x="70" y="730" width="690" height="175" rx="18" fill="#fff4df" stroke="#e7c47e" stroke-width="2"/>
  <text x="415" y="770" text-anchor="middle" class="section">Persistent audit trail</text>
  <text x="110" y="805" class="body">AgentRun: objective, plan, memory, result, status</text>
  <text x="110" y="833" class="body">AgentStep: sequence, tool, rationale, input, output</text>
  <text x="110" y="861" class="body">Errors and completion times are recorded</text>
  <text x="110" y="889" class="small">A reviewer can reconstruct what happened and why.</text>
  <rect x="840" y="730" width="690" height="175" rx="18" fill="#f0eaff" stroke="#b9a6e5" stroke-width="2"/>
  <text x="1185" y="770" text-anchor="middle" class="section">Human review boundary</text>
  <text x="880" y="805" class="body">Mother receives understandable next steps</text>
  <text x="880" y="833" class="body">Family receives appropriate support guidance</text>
  <text x="880" y="861" class="body">Midwife or doctor reviews important results</text>
  <text x="880" y="889" class="small">Decision support — not autonomous medical care.</text>
</svg>
