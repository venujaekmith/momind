<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc">
  <title id="title">Momind hybrid AI data flow</title>
  <desc id="desc">End-to-end data flow from maternal input through storage, feature extraction, hybrid risk assessment, explanation, and care coordination.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#eef5ff"/></linearGradient>
    <linearGradient id="header" x1="0" x2="1"><stop offset="0" stop-color="#123b70"/><stop offset="1" stop-color="#176b87"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#17324d" flood-opacity=".14"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#42627d"/></marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#fff}.subtitle{font:400 17px Arial,sans-serif;fill:#dcecff}
      .label{font:700 18px Arial,sans-serif;fill:#17324d}.body{font:400 15px Arial,sans-serif;fill:#36536b}
      .small{font:400 13px Arial,sans-serif;fill:#527087}.section{font:700 21px Arial,sans-serif;fill:#123b70}
      .box{stroke:#c8d9e8;stroke-width:2;rx:16}.arrow{stroke:#42627d;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="950" fill="url(#bg)"/>
  <rect width="1600" height="120" fill="url(#header)"/>
  <text x="70" y="56" class="title">MOMIND — HYBRID AI DATA FLOW</text>
  <text x="70" y="88" class="subtitle">From a maternal health event to explainable, human-reviewed care coordination</text>

  <text x="70" y="165" class="section">Input and evidence collection</text>
  <g filter="url(#shadow)">
    <rect class="box" x="70" y="190" width="260" height="135" fill="#fff"/>
    <rect class="box" x="380" y="190" width="260" height="135" fill="#fff"/>
    <rect class="box" x="690" y="190" width="260" height="135" fill="#fff"/>
    <rect class="box" x="1000" y="190" width="260" height="135" fill="#fff"/>
    <rect class="box" x="1310" y="190" width="220" height="135" fill="#fff"/>
  </g>
  <text x="200" y="230" text-anchor="middle" class="label">Mother input</text>
  <text x="200" y="258" text-anchor="middle" class="body">BP, symptoms, mood,</text><text x="200" y="281" text-anchor="middle" class="body">fetal movement, weight</text>
  <text x="510" y="230" text-anchor="middle" class="label">Lab evidence</text>
  <text x="510" y="258" text-anchor="middle" class="body">Values, units, ranges,</text><text x="510" y="281" text-anchor="middle" class="body">uploaded report text</text>
  <text x="820" y="230" text-anchor="middle" class="label">Pregnancy context</text>
  <text x="820" y="258" text-anchor="middle" class="body">Week, history, progress,</text><text x="820" y="281" text-anchor="middle" class="body">previous pregnancies</text>
  <text x="1130" y="230" text-anchor="middle" class="label">Postpartum context</text>
  <text x="1130" y="258" text-anchor="middle" class="body">Mood, stress, recovery,</text><text x="1130" y="281" text-anchor="middle" class="body">journal and support needs</text>
  <text x="1420" y="230" text-anchor="middle" class="label">Historical memory</text>
  <text x="1420" y="258" text-anchor="middle" class="body">Prior assessments</text><text x="1420" y="281" text-anchor="middle" class="body">and trends</text>

  <path class="arrow" d="M800 350 L800 405"/>
  <rect x="240" y="405" width="1120" height="120" rx="18" fill="#dceeff" stroke="#9ec7e2" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="445" text-anchor="middle" class="section">Django validation, persistence, and feature extraction</text>
  <text x="800" y="478" text-anchor="middle" class="body">Store trusted records → normalize context → create structured features → preserve longitudinal evidence</text>
  <text x="800" y="503" text-anchor="middle" class="small">The LLM is not the first or only step. Structured data is prepared before explanation.</text>

  <path class="arrow" d="M800 550 L800 600"/>
  <text x="70" y="595" class="section">Hybrid assessment engine</text>
  <g filter="url(#shadow)">
    <rect class="box" x="70" y="625" width="400" height="150" fill="#e8f7f4" stroke="#9bd6c9"/>
    <rect class="box" x="600" y="625" width="400" height="150" fill="#fff4df" stroke="#e7c47e"/>
    <rect class="box" x="1130" y="625" width="400" height="150" fill="#f0eaff" stroke="#b9a6e5"/>
  </g>
  <text x="270" y="665" text-anchor="middle" class="label">Predictive model</text>
  <text x="270" y="695" text-anchor="middle" class="body">XGBoost score when model is</text><text x="270" y="718" text-anchor="middle" class="body">available and versioned</text>
  <text x="800" y="665" text-anchor="middle" class="label">Clinical safety rules</text>
  <text x="800" y="695" text-anchor="middle" class="body">High BP, bleeding, fainting,</text><text x="800" y="718" text-anchor="middle" class="body">reduced movement, abnormal labs</text>
  <text x="1330" y="665" text-anchor="middle" class="label">LLM explanation</text>
  <text x="1330" y="695" text-anchor="middle" class="body">Plain language, findings,</text><text x="1330" y="718" text-anchor="middle" class="body">recommendations, urgency</text>

  <path class="arrow" d="M470 800 L650 850"/>
  <path class="arrow" d="M800 800 L800 850"/>
  <path class="arrow" d="M1130 800 L950 850"/>
  <rect x="270" y="840" width="1060" height="75" rx="18" fill="#123b70"/>
  <text x="800" y="872" text-anchor="middle" style="font:700 20px Arial;fill:#fff">Explainable care coordination</text>
  <text x="800" y="897" text-anchor="middle" style="font:400 15px Arial;fill:#dcecff">Risk level + evidence + next steps + alert + human review</text>
</svg>
