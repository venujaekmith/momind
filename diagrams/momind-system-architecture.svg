<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Momind system architecture</title>
  <desc id="desc">Layered architecture showing users, Django application modules, services, data, AI, and safety coordination.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef5ff"/>
    </linearGradient>
    <linearGradient id="header" x1="0" x2="1">
      <stop offset="0" stop-color="#123b70"/>
      <stop offset="1" stop-color="#176b87"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#17324d" flood-opacity=".14"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#42627d"/>
    </marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#fff}
      .subtitle{font:400 17px Arial,sans-serif;fill:#dcecff}
      .section{font:700 20px Arial,sans-serif;fill:#123b70}
      .label{font:700 17px Arial,sans-serif;fill:#17324d}
      .body{font:400 15px Arial,sans-serif;fill:#36536b}
      .small{font:400 13px Arial,sans-serif;fill:#527087}
      .box{stroke:#c8d9e8;stroke-width:2;rx:16}
      .arrow{stroke:#42627d;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="120" fill="url(#header)"/>
  <text x="70" y="56" class="title">MOMIND — SYSTEM ARCHITECTURE</text>
  <text x="70" y="88" class="subtitle">AI-assisted maternal health, family support, and care coordination platform</text>

  <text x="70" y="160" class="section">1. Users and role-specific interfaces</text>
  <g filter="url(#shadow)">
    <rect class="box" x="70" y="185" width="220" height="100" fill="#fff"/>
    <rect class="box" x="320" y="185" width="220" height="100" fill="#fff"/>
    <rect class="box" x="570" y="185" width="220" height="100" fill="#fff"/>
    <rect class="box" x="820" y="185" width="220" height="100" fill="#fff"/>
    <rect class="box" x="1070" y="185" width="220" height="100" fill="#fff"/>
    <rect class="box" x="1320" y="185" width="210" height="100" fill="#fff"/>
  </g>
  <text x="180" y="225" text-anchor="middle" class="label">Mother</text><text x="180" y="252" text-anchor="middle" class="body">Pregnancy dashboard</text>
  <text x="430" y="225" text-anchor="middle" class="label">Father / Family</text><text x="430" y="252" text-anchor="middle" class="body">Support updates</text>
  <text x="680" y="225" text-anchor="middle" class="label">Midwife</text><text x="680" y="252" text-anchor="middle" class="body">Care coordination</text>
  <text x="930" y="225" text-anchor="middle" class="label">Doctor</text><text x="930" y="252" text-anchor="middle" class="body">Clinical review</text>
  <text x="1175" y="225" text-anchor="middle" class="label">Hospital</text><text x="1175" y="252" text-anchor="middle" class="body">Operations</text>
  <text x="1425" y="225" text-anchor="middle" class="label">Staff</text><text x="1425" y="252" text-anchor="middle" class="body">Authorized access</text>

  <path class="arrow" d="M800 300 L800 345"/>
  <rect x="70" y="345" width="1460" height="155" rx="18" fill="#dceeff" stroke="#9ec7e2" stroke-width="2"/>
  <text x="800" y="380" text-anchor="middle" class="section">2. Django web application</text>
  <g>
    <rect class="box" x="105" y="402" width="190" height="62" fill="#fff"/>
    <rect class="box" x="330" y="402" width="190" height="62" fill="#fff"/>
    <rect class="box" x="555" y="402" width="190" height="62" fill="#fff"/>
    <rect class="box" x="780" y="402" width="190" height="62" fill="#fff"/>
    <rect class="box" x="1005" y="402" width="190" height="62" fill="#fff"/>
    <rect class="box" x="1230" y="402" width="260" height="62" fill="#fff"/>
  </g>
  <text x="200" y="440" text-anchor="middle" class="label">Authentication</text>
  <text x="425" y="440" text-anchor="middle" class="label">Dashboards</text>
  <text x="650" y="440" text-anchor="middle" class="label">Chat</text>
  <text x="875" y="440" text-anchor="middle" class="label">Community</text>
  <text x="1100" y="440" text-anchor="middle" class="label">Postpartum</text>
  <text x="1360" y="440" text-anchor="middle" class="label">URLs, views, forms, security</text>

  <path class="arrow" d="M800 515 L800 560"/>
  <rect x="70" y="560" width="1460" height="145" rx="18" fill="#e8f7f4" stroke="#9bd6c9" stroke-width="2"/>
  <text x="800" y="595" text-anchor="middle" class="section">3. Domain and application services</text>
  <g>
    <rect class="box" x="105" y="615" width="265" height="58" fill="#fff"/>
    <rect class="box" x="400" y="615" width="265" height="58" fill="#fff"/>
    <rect class="box" x="695" y="615" width="265" height="58" fill="#fff"/>
    <rect class="box" x="990" y="615" width="225" height="58" fill="#fff"/>
    <rect class="box" x="1245" y="615" width="245" height="58" fill="#fff"/>
  </g>
  <text x="238" y="650" text-anchor="middle" class="label">Pregnancy tracking</text>
  <text x="532" y="650" text-anchor="middle" class="label">Family and appointments</text>
  <text x="827" y="650" text-anchor="middle" class="label">Risk and lab services</text>
  <text x="1102" y="650" text-anchor="middle" class="label">Notifications</text>
  <text x="1367" y="650" text-anchor="middle" class="label">Maternal Care Agent</text>

  <path class="arrow" d="M490 720 L490 780"/>
  <path class="arrow" d="M1110 720 L1110 780"/>
  <rect x="70" y="780" width="690" height="145" rx="18" fill="#fff4df" stroke="#e7c47e" stroke-width="2"/>
  <text x="415" y="815" text-anchor="middle" class="section">4A. Data layer</text>
  <text x="110" y="850" class="body">Django ORM + SQLite prototype</text>
  <text x="110" y="878" class="body">Users, pregnancies, fetal health, labs</text>
  <text x="110" y="906" class="body">Assessments, alerts, chat, audit records</text>
  <rect x="840" y="780" width="690" height="145" rx="18" fill="#f0eaff" stroke="#b9a6e5" stroke-width="2"/>
  <text x="1185" y="815" text-anchor="middle" class="section">4B. AI and safety layer</text>
  <text x="880" y="850" class="body">XGBoost risk prediction + clinical rules</text>
  <text x="880" y="878" class="body">Groq LLM for explanations and summaries</text>
  <text x="880" y="906" class="body">Fallbacks, human review, alerts, audit trail</text>
</svg>
