{% extends 'base.html' %}

{% block title %}Log Mood{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h3 class="text-center mb-4">How are you feeling today?</h3>
            
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                
                <div class="d-grid">
                    <button type="submit" class="btn btn-success btn-lg">Save Mood</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
