<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Postpartum Companion{% endblock %}</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f5f5f0; color: #1a1a18; min-height: 100vh; }
  a { color: inherit; text-decoration: none; }

  .nav { background: #fff; border-bottom: 1px solid #e5e5e0; padding: 0 1.5rem; display: flex; align-items: center; gap: 1.5rem; height: 52px; }
  .nav-brand { font-weight: 500; font-size: 15px; color: #1D9E75; }
  .nav-links { display: flex; gap: 4px; margin-left: auto; }
  .nav-link { padding: 6px 12px; border-radius: 6px; font-size: 13px; color: #666; transition: background 0.15s; }
  .nav-link:hover, .nav-link.active { background: #f0f0eb; color: #1a1a18; }

  .container { max-width: 760px; margin: 0 auto; padding: 1.5rem 1rem; }

  .card { background: #fff; border: 1px solid #e5e5e0; border-radius: 10px; padding: 1.25rem; }
  .card + .card { margin-top: 1rem; }

  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 6px; font-size: 13px; cursor: pointer; border: 1px solid #d0d0cb; background: #fff; color: #444; transition: background 0.15s; }
  .btn:hover { background: #f5f5f0; }
  .btn-primary { background: #1D9E75; color: #fff; border-color: #1D9E75; }
  .btn-primary:hover { background: #198a66; }

  .stress-bar-wrap { height: 8px; background: #f0f0eb; border-radius: 99px; overflow: hidden; margin: 8px 0; }
  .stress-bar { height: 100%; border-radius: 99px; transition: width 1s ease; }
  .level-low { color: #085041; background: #E1F5EE; }
  .level-moderate { color: #633806; background: #FAEEDA; }
  .level-high { color: #501313; background: #FCEBEB; }
  .bar-low { background: #1D9E75; }
  .bar-moderate { background: #BA7517; }
  .bar-high { background: #E24B4A; }

  .badge { display: inline-block; padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 500; }

  {% block extra_css %}{% endblock %}
</style>
</head>
<body>

<nav class="nav">
  <span class="nav-brand">💚 Postpartum</span>
  <div class="nav-links">
    <a href="{% url 'postpartum:ai_dash' %}" class="nav-link {% block nav_home %}{% endblock %}">Home</a>
    <a href="{% url 'postpartum:chat' %}" class="nav-link {% block nav_chat %}{% endblock %}">Chat</a>
    <a href="{% url 'postpartum:draw' %}" class="nav-link {% block nav_draw %}{% endblock %}">Draw</a>
    <a href="{% url 'postpartum:wellness' %}" class="nav-link {% block nav_wellness %}{% endblock %}">Wellness</a>
  </div>
</nav>

<div class="container">
  {% block content %}{% endblock %}
</div>

{% block extra_js %}{% endblock %}
</body>
</html>
